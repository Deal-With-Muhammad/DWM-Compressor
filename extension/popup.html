<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0f1a;
        color: #e5e7eb;
        padding: 18px;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .badge { width: 34px; height: 34px; border-radius: 9px; display: block; }
      h1 { font-size: 15px; margin: 0; }
      p { font-size: 12px; color: #9ca3af; margin: 8px 0 14px; line-height: 1.5; }
      button {
        width: 100%; padding: 10px; border: 0; border-radius: 999px;
        background: #4f46e5; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
      }
      button:hover { background: #4338ca; }
      .tip { font-size: 11px; color: #6b7280; margin-top: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img class="badge" src="icons/icon.svg" alt="" />
      <h1>DWM Compressor</h1>
    </div>
    <p>Compress &amp; convert PDFs, images and videos — private, in your browser.</p>
    <button id="open">Open DWM Compressor</button>
    <div class="tip">Tip: right-click any page → “Open DWM Compressor”.</div>
    <script src="popup.js"></script>
  </body>
</html>
